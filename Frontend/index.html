<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Cinemax Piraju</title>

    <link rel="stylesheet" href="css/pages/cliente/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <header class="login-header">

                <div class="cinema-logo">
                    <img src="assets/logo/Logo Cinemax.png" alt="Logo do Cinema">
                </div>

                <h1>Bem-vindo ao Cinemax Piraju</h1>

                <p>
                    Acesse sua conta e compre seus ingressos de forma rápida e segura.
                </p>

            </header>


            <form class="login-form" id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input 
                        type="email" 
                        id="email"
                        name="email"
                        placeholder="Digite seu email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">
                                
                    <label for="senha">
                        Senha
                    </label>
                
                    <div class="password-wrapper">
                    
                        <input 
                            type="password" 
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    
                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-password"
                            aria-label="Mostrar senha"
                            title="Mostrar senha"
                        >
                            <svg
                                class="icone-olho"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2.2 12s3.5-6 9.8-6 9.8 6 9.8 6-3.5 6-9.8 6-9.8-6-9.8-6Z"
                                />
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.7"
                                />
                            </svg>
                        </button>
                    
                    </div>
                
                </div>


                <button 
                    type="submit" 
                    class="login-button"
                    id="login-button"
                >
                    Entrar
                </button>


                <p class="login-error" id="login-error">
                    
                </p>


            </form>


            <footer class="login-footer">

                <p>
                    Não possui uma conta?
                    <a href="pages/public/cadastro.html">
                        Criar conta
                    </a>
                </p>

                <small>
                    © 2026 Cinemax Piraju • Todos os direitos reservados.
                </small>

            </footer>


        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/login.js"></script>

</body>

</html>
