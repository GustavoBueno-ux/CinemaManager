<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | Cinemax Piraju</title>

    <link
        rel="stylesheet"
        href="/css/pages/cliente/perfil.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">

            <a href="home.html">

                <img src="../../assets/logo/Logo Cinemax.png" alt="Cinemax Piraju">

            </a>

        </div>

        <div class="usuario-container">

            <button
                class="usuario-btn"
                id="usuarioBtn">

                <span id="nomeUsuario">

                    Usuário

                </span>

                <span>

                    ▼

                </span>

            </button>

            <div
                class="menu-usuario"
                id="menuUsuario">

                <a href="meus-ingressos.html">
                    🎟 Meus ingressos
                </a>

                <a href="perfil.html">
                    👤 Meu perfil
                </a>

                <a
                    href="#"
                    id="logoutBtn">

                    🚪 Sair

                </a>

            </div>

        </div>

    </header>

    <main class="pagina-perfil">

        <section class="conteudo-perfil">

            <button
                type="button"
                class="botao-voltar"
                id="botao-voltar">

                <span>←</span>

                Voltar

            </button>

            <div
                class="mensagem-status"
                id="mensagem-status">

                Carregando perfil...

            </div>

            <article
                class="perfil-card"
                id="perfil-card"
                hidden>

                <section class="perfil-resumo">

                    <div class="perfil-avatar">

                        <span id="perfil-inicial">
                            U
                        </span>

                    </div>

                    <div class="perfil-identidade">

                        <h1 id="perfil-nome">
                            Nome do usuário
                        </h1>

                    </div>

                </section>

                <section class="perfil-informacoes">

                    <div class="perfil-informacao">

                        <span>
                            Nome completo
                        </span>

                        <strong id="nome-completo">
                            --
                        </strong>

                    </div>

                    <div class="perfil-informacao">

                        <span>
                            E-mail
                        </span>

                        <strong id="email">
                            --
                        </strong>

                    </div>

                    <div class="perfil-informacao">

                        <span>
                            Cliente desde
                        </span>

                        <strong id="data-cadastro">
                            --
                        </strong>

                    </div>

                    <div class="perfil-informacao">

                        <span>
                            Ingressos comprados
                        </span>

                        <strong id="quantidade-ingressos">
                            --
                        </strong>

                    </div>

                </section>

            </article>

        </section>

    </main>

    <footer>

        <p>

            © 2026 Cinemax Piraju. Todos os direitos reservados.

        </p>

    </footer>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/cliente/navbar.js"></script>
    <script src="/js/pages/cliente/perfil.js"></script>

</body>

</html>
