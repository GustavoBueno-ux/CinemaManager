<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Meus ingressos | Cinemax Piraju</title>

    <link
        rel="stylesheet"
        href="/css/pages/cliente/meus-ingressos.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">

            <a href="home.html">

                <img src="../../assets/logo/Logo Cinemax.png" alt="Cinemax Piraju">

            </a>

        </div>

        <div class="usuario-container">

            <button
                class="usuario-btn"
                id="usuarioBtn">

                <span id="nomeUsuario">

                    Usuário

                </span>

                <span>

                    ▼

                </span>

            </button>

            <div
                class="menu-usuario"
                id="menuUsuario">

                <a href="meus-ingressos.html">
                    🎟 Meus ingressos
                </a>

                <a href="perfil.html">
                    👤 Meu perfil
                </a>

                <a
                    href="#"
                    id="logoutBtn">

                    🚪 Sair

                </a>

            </div>

        </div>

    </header>

    <main class="pagina-ingressos">

        <div class="conteudo-ingressos">

            <button
                type="button"
                id="botao-voltar"
                class="botao-voltar"
                aria-label="Voltar para a página anterior">

                <span aria-hidden="true">←</span>
                Voltar

            </button>

            <h1>Meus ingressos</h1>

            <p
                id="mensagem-status"
                class="mensagem-status"
                aria-live="polite">

                Carregando ingressos...

            </p>

            <section
                id="lista-ingressos"
                class="lista-ingressos"
                aria-label="Lista de ingressos">
            </section>

        </div>

    </main>

    <footer>

        <p>
        
            © 2026 Cinemax Piraju. Todos os direitos reservados.
        
        </p>
    
    </footer>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/cliente/navbar.js"></script>
    <script src="/js/pages/cliente/meus-ingressos.js"></script>

</body>

</html>
